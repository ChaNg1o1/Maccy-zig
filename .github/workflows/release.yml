name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish macOS app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install packaging dependencies
        run: brew install imagemagick

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.tag }}"
            prerelease="${{ inputs.prerelease }}"
          else
            release_tag="${GITHUB_REF_NAME}"
            prerelease="false"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+(\.[0-9]+){0,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0, got: $release_tag" >&2
            exit 1
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "ZIP_PATH=dist/MaccyZig-${release_tag}-macOS.zip" >> "$GITHUB_ENV"
          echo "SHA_PATH=dist/MaccyZig-${release_tag}-macOS.zip.sha256" >> "$GITHUB_ENV"

      - name: Run tests
        run: zig build test

      - name: Package app
        run: ./scripts/package-app.sh

      - name: Verify packaged app
        run: ./scripts/smoke-package.sh

      - name: Create downloadable archive
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/Maccy.app" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "$SHA_PATH"

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          checksum="$(cut -d ' ' -f 1 "$SHA_PATH")"
          cat > dist/release-notes.md <<EOF
          \`\`\`text
          __  __                         ______ _
          |  \/  | __ _  ___ ___ _   _  |__  /(_) __ _
          | |\/| |/ _\` |/ __/ __| | | |   / / | |/ _\` |
          | |  | | (_| | (_| (__| |_| |  / /_ | | (_| |
          |_|  |_|\__,_|\___\___|\__, | /____|/ |\__, |
                                  |___/      |__/ |___/
          \`\`\`

          ## MaccyZig ${RELEASE_TAG}

          A native macOS clipboard manager built with Zig and AppKit.

          ## Download

          Download \`MaccyZig-${RELEASE_TAG}-macOS.zip\` from this release, unzip it, then move \`Maccy.app\` to \`/Applications\`.

          This build is ad-hoc signed in CI. macOS may still show a security prompt the first time you open it.

          ## Verification

          SHA-256:

          \`\`\`text
          ${checksum}
          \`\`\`

          ## Requirements

          - macOS 14 or newer
          - Accessibility permission may be required for paste actions
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaccyZig-${{ env.RELEASE_TAG }}-macOS
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SHA_PATH }}
            dist/verification/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$RELEASE_TAG"
            "$ZIP_PATH#MaccyZig-${RELEASE_TAG}-macOS.zip"
            "$SHA_PATH#MaccyZig-${RELEASE_TAG}-macOS.zip.sha256"
            --title "MaccyZig ${RELEASE_TAG}"
            --notes-file dist/release-notes.md
            --target "$GITHUB_SHA"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
